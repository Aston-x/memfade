name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: 单元测试（Python ${{ matrix.python-version }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 跑测试（标准库 unittest，无第三方依赖）
        run: python -m unittest discover -s tests -t . -v

  vendor-sync:
    name: 适配器自带的核心副本与源目录一致
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 检查副本是否漂移
        run: python -m unittest tests.test_vendored_sync -v

  build:
    name: 打包各宿主适配器
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 构建
        run: python scripts/build_plugin.py --zip

      - uses: actions/upload-artifact@v4
        with:
          name: memfade-plugins
          path: dist/

  koishi:
    name: Koishi 插件类型检查
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adapters/koishi
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 装依赖
        run: npm install koishi@latest typescript@5

      - name: 类型检查 + 构建
        run: npx tsc -p tsconfig.json

      - name: 跑行为测试（会起一个真的 Python 侧车）
        run: npm test

      - uses: actions/upload-artifact@v4
        with:
          name: koishi-plugin
          path: adapters/koishi/lib

